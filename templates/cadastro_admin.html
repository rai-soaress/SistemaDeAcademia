<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Admin</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/cadastro_admin.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>

<div class="form-container">
    <div class="brand-lockup">
        <img src="{{ url_for('static', filename='img/logo_fit_trainer.png') }}" alt="Fit Trainer logo" class="brand-logo brand-logo--hero">
        <h1>Cadastrar Administrador</h1>
    </div>

    {% if erro %}<p class="cadastro-erro" role="alert">{{ erro }}</p>{% endif %}
    {% for mensagem in get_flashed_messages() %}
        <p role="alert">{{ mensagem }}</p>
    {% endfor %}

    <form action="{{ url_for('auth.registrar_admin') }}" method="POST">
        <input type="text" name="nome" placeholder="Nome" value="{{ nome|default('') }}" maxlength="100" required>
        <input type="email" name="email" placeholder="Email" value="{{ email|default('') }}" maxlength="100" required>
        <input type="password" name="senha" placeholder="Senha" autocomplete="new-password" minlength="8" aria-describedby="senha-requisitos" required>
        <p id="senha-requisitos">Use pelo menos 8 caracteres, com letra maiúscula, letra minúscula, número e símbolo.</p>

        <button type="submit">Cadastrar</button>
    </form>

    <a href="{{ url_for('auth.login') }}">Voltar</a>
</div>

</body>
</html>
