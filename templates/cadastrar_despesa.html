<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Despesa</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/cadastrar_despesa.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>

<header class="topbar">
    <div>
        <span class="eyebrow">Financeiro</span>
        <h1>Cadastrar despesa</h1>
    </div>

    <nav>
        <a href="{{ url_for('despesa.listar') }}">Despesas</a>
        <a href="{{ url_for('admin.dashboard') }}">Dashboard</a>
    </nav>
</header>

<main class="form-page">
    <form class="form-card" method="POST" action="{{ url_for('despesa.cadastrar') }}">
        <label for="descricao">Descricao</label>
        <input id="descricao" type="text" name="descricao" maxlength="150" required>

        <div class="grid">
            <div>
                <label for="valor">Valor</label>
                <input id="valor" type="number" name="valor" min="0" step="0.01" required>
            </div>

            <div>
                <label for="data">Data</label>
                <input id="data" type="date" name="data" value="{{ data_atual }}" required>
            </div>
        </div>

        <label for="categoria">Categoria</label>
        <select id="categoria" name="categoria" required>
            {% for categoria in categorias %}
                <option value="{{ categoria }}">{{ categoria }}</option>
            {% endfor %}
        </select>

        <label for="observacao">Observacao</label>
        <textarea id="observacao" name="observacao" rows="4"></textarea>

        <div class="actions">
            <a href="{{ url_for('despesa.listar') }}">Cancelar</a>
            <button type="submit">Salvar despesa</button>
        </div>
    </form>
</main>

<script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
